# Checks every push: tests and an unsigned build of both apps (no secrets needed).
name: CI

on:
  push:
    branches: [main, fs-test]
  pull_request:

permissions:
  contents: read

jobs:
  scripts:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/*.test.mjs

  windows:
    runs-on: windows-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build (no installer)
        working-directory: desktop
        run: |
          npm ci
          npx tauri build --no-bundle
      - uses: actions/upload-artifact@v4
        with:
          name: proggaa-windows-exe
          path: desktop/src-tauri/target/release/Proggaa.exe
          retention-days: 3

  android:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test and build
        working-directory: android
        run: gradle --no-daemon testDebugUnitTest assembleDebug lintDebug
      - uses: actions/upload-artifact@v4
        with:
          name: proggaa-debug-apk
          path: android/app/build/outputs/apk/debug/*.apk
          retention-days: 7
