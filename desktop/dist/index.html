<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Prooggaa</title>
  <style>
    :root { color-scheme: light; }
    html, body { height: 100%; margin: 0; }
    body {
      display: flex; align-items: center; justify-content: center;
      background: #fcf9f3; color: #1f1433;
      background-image: radial-gradient(rgba(31, 20, 51, 0.07) 1px, transparent 1.2px); background-size: 14px 14px;
      font: 15px/1.5 "Segoe UI", system-ui, sans-serif; text-align: center;
    }
    img { width: 132px; height: 132px; }
    p { margin: 8px 0 0; color: #5b5170; }
    #offline { display: none; }
    button {
      margin-top: 18px; padding: 10px 22px; border: 2px solid #1f1433; border-radius: 14px; box-shadow: 3px 3px 0 #1f1433;
      background: #53328b; color: #fff; font: inherit; font-weight: 700; cursor: pointer;
    }
    /* No Windows title bar: drag anywhere along the top, and our own window buttons. */
    .titlebar { position: fixed; inset: 0 0 auto 0; height: 36px; display: flex; justify-content: flex-end; -webkit-app-region: drag; }
    .titlebar a { -webkit-app-region: no-drag; width: 46px; display: grid; place-items: center; color: #1f1433; }
    .titlebar a:hover { background: rgba(31, 20, 51, 0.08); }
    .titlebar a.close:hover { background: #c42b1c; color: #fff; }
    .titlebar svg { width: 10px; height: 10px; }
    .dots::after { content: ""; animation: dots 1.2s steps(4) infinite; }
    @keyframes dots { 0% { content: ""; } 25% { content: "."; } 50% { content: ".."; } 75% { content: "..."; } }
  </style>
</head>
<body>
  <div class="titlebar">
    <a href="proggaa://window/minimize" title="Minimise" aria-label="Minimise"><svg viewBox="0 0 10 10"><path d="M0 5h10" stroke="currentColor" /></svg></a>
    <a href="proggaa://window/maximize" title="Maximise" aria-label="Maximise"><svg viewBox="0 0 10 10"><rect x="0.5" y="0.5" width="9" height="9" fill="none" stroke="currentColor" /></svg></a>
    <a href="proggaa://window/close" class="close" title="Close" aria-label="Close"><svg viewBox="0 0 10 10"><path d="M0 0l10 10M10 0L0 10" stroke="currentColor" /></svg></a>
  </div>
  <main>
    <img src="logo.png" alt="Prooggaa" />
    <div id="connecting"><p class="dots">Opening Prooggaa</p></div>
    <div id="offline">
      <p><strong style="color:#1f1433">You're offline</strong></p>
      <p>Prooggaa needs the internet. It will open as soon as you're connected.</p>
      <button type="button" id="retry">Try again</button>
    </div>
  </main>
  <script>
    // The app's start page: checks the site can be reached, then opens it.
    // Without a connection it waits here instead of showing a browser error.
    const SITE = "https://prooggaa.com";
    const START = SITE + "/dashboard";
    let timer = null;

    function show(id) {
      document.getElementById("connecting").style.display = id === "connecting" ? "block" : "none";
      document.getElementById("offline").style.display = id === "offline" ? "block" : "none";
    }

    async function reachable() {
      const ctrl = new AbortController();
      const t = setTimeout(() => ctrl.abort(), 8000);
      try {
        // An opaque (no-cors) answer is enough: it means the site responded.
        await fetch(SITE + "/api/health", { mode: "no-cors", cache: "no-store", signal: ctrl.signal });
        return true;
      } catch {
        return false;
      } finally {
        clearTimeout(t);
      }
    }

    async function open() {
      clearTimeout(timer);
      show("connecting");
      if (await reachable()) {
        location.replace(START);
      } else {
        show("offline");
        timer = setTimeout(open, 5000);
      }
    }

    document.getElementById("retry").addEventListener("click", open);
    window.addEventListener("online", open);
    open();
  </script>
</body>
</html>
