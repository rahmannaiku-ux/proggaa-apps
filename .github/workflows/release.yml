# Builds both apps and publishes them as a GitHub Release in this repo.
# Installed apps look for updates at
#   https://github.com/rahmannaiku-ux/proggaa-apps/releases/latest/download/latest.json          (Windows)
#   https://github.com/rahmannaiku-ux/proggaa-apps/releases/latest/download/android-latest.json  (Android)
# and the website links to .../latest/download/Proggaa-Setup.exe and .../Proggaa.apk.
#
# Triggered by pushing a tag vMAJOR.MINOR.PATCH equal to the version in
# package.json (see README: "Releasing an update").
#
# Repository secrets (Settings -> Secrets and variables -> Actions):
#   TAURI_SIGNING_PRIVATE_KEY           the Windows updater's private key (file contents)
#   TAURI_SIGNING_PRIVATE_KEY_PASSWORD  its password
#   ANDROID_KEYSTORE_BASE64             the Android signing keystore (.p12), base64
#   ANDROID_KEYSTORE_PASSWORD           its password

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

jobs:
  check:
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.v.outputs.version }}
    steps:
      - uses: actions/checkout@v4
      - id: v
        name: The tag must match package.json
        run: |
          VERSION=$(node -p "require('./package.json').version")
          if [ "v$VERSION" != "$GITHUB_REF_NAME" ]; then
            echo "::error::Tag $GITHUB_REF_NAME doesn't match package.json version $VERSION. Run: node scripts/set-version.mjs <version>"
            exit 1
          fi
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
      - name: The signing secrets must be set
        env:
          A: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY != '' }}
          B: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD != '' }}
          C: ${{ secrets.ANDROID_KEYSTORE_BASE64 != '' }}
          D: ${{ secrets.ANDROID_KEYSTORE_PASSWORD != '' }}
        run: |
          [ "$A$B$C$D" = "truetruetruetrue" ] || { echo "::error::A signing secret is missing (see the top of this file)"; exit 1; }
      - run: node --test scripts/*.test.mjs

  windows:
    needs: check
    runs-on: windows-latest
    timeout-minutes: 60
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - uses: dtolnay/rust-toolchain@stable
      - uses: Swatinem/rust-cache@v2
        with:
          workspaces: desktop/src-tauri -> target
      - name: Test
        working-directory: desktop/src-tauri
        run: cargo test --locked
      - name: Build and sign the installer
        working-directory: desktop
        env:
          TAURI_SIGNING_PRIVATE_KEY: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY }}
          TAURI_SIGNING_PRIVATE_KEY_PASSWORD: ${{ secrets.TAURI_SIGNING_PRIVATE_KEY_PASSWORD }}
        run: |
          npm ci
          npx tauri build
      - uses: actions/upload-artifact@v4
        with:
          name: windows
          path: desktop/src-tauri/target/release/bundle/nsis/
          if-no-files-found: error

  android:
    needs: check
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: "8.11.1"
      - name: Test, build and sign the APK
        working-directory: android
        env:
          ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
          ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          export ANDROID_KEYSTORE_PATH="$RUNNER_TEMP/proggaa-release.p12"
          echo "$ANDROID_KEYSTORE_BASE64" | base64 -d > "$ANDROID_KEYSTORE_PATH"
          gradle --no-daemon testReleaseUnitTest assembleRelease
          rm -f "$ANDROID_KEYSTORE_PATH"
      - name: Check the APK is signed with the Proggaa key
        run: |
          APK=$(ls android/app/build/outputs/apk/release/*.apk)
          "$ANDROID_HOME"/build-tools/$(ls "$ANDROID_HOME/build-tools" | sort -V | tail -1)/apksigner verify --print-certs "$APK" | tee certs.txt
          grep -qi "CN=Proggaa" certs.txt || { echo "::error::The APK isn't signed with the Proggaa key"; exit 1; }
      - uses: actions/upload-artifact@v4
        with:
          name: android
          path: android/app/build/outputs/apk/release/*.apk
          if-no-files-found: error

  publish:
    needs: [check, windows, android]
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/download-artifact@v4
        with:
          path: build
      - name: Release notes from the tag message
        run: |
          git fetch --force origin "refs/tags/$GITHUB_REF_NAME:refs/tags/$GITHUB_REF_NAME"
          if [ "$(git cat-file -t "$GITHUB_REF_NAME")" = "tag" ]; then
            git tag -l --format='%(contents:subject)%0a%0a%(contents:body)' "$GITHUB_REF_NAME" | sed -e :a -e '/^\n*$/{$d;N;ba' -e '}' > notes.md
          fi
          [ -s notes.md ] || echo "Proggaa ${{ needs.check.outputs.version }}" > notes.md
          cat notes.md
      - name: Collect the files and write the update manifests
        run: >
          node scripts/make-manifests.mjs
          --version "${{ needs.check.outputs.version }}" --tag "$GITHUB_REF_NAME"
          --in build --out release-assets --notes-file notes.md
      - name: Publish
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # A draft first, so no app sees a manifest before its files are uploaded.
          gh release create "$GITHUB_REF_NAME" release-assets/* \
            --title "Proggaa ${{ needs.check.outputs.version }}" \
            --notes-file notes.md \
            --draft
          gh release edit "$GITHUB_REF_NAME" --draft=false --latest
